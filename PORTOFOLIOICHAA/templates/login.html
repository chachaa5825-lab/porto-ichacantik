{% extends "base.html" %}
{% block title %}Login Admin — {{ data.profile.name }}{% endblock %}

{% block content %}
<div style="display:flex; justify-content:center; align-items:center; min-height:60vh;">
  <div class="glass-card" style="max-width:420px; width:100%;">
    <div style="text-align:center; margin-bottom:1.5rem;">
      <h2 style="font-size:1.6rem; margin-bottom:0.4rem;">🔐 Admin Login</h2>
      <p style="color:var(--text-muted); font-size:0.9rem;">Masuk untuk mengelola data portofolio</p>
    </div>
    <form action="{{ url_for('login') }}" method="POST">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" class="form-control" placeholder="Masukkan username" required autofocus />
      </div>
      <div class="form-group">
        <label>Password</label>
        <div style="position:relative;">
          <input type="password" name="password" id="loginPassword" class="form-control" placeholder="Masukkan password" required />
          <button type="button" onclick="togglePassword()" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:1.1rem;" title="Tampilkan/Sembunyikan">👁</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Masuk sebagai Admin</button>
    </form>
    <div style="text-align:center; margin-top:1.2rem;">
      <a href="{{ url_for('index') }}" class="btn btn-outline btn-sm">← Kembali ke Portofolio</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  function togglePassword() {
    var input = document.getElementById('loginPassword');
    input.type = input.type === 'password' ? 'text' : 'password';
  }
</script>
{% endblock %}
